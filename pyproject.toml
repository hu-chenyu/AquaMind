# AquaMind 项目元数据与工具链配置。
# 本文件由 M0 占位版补全而来（AM-Day1 / M1-D01），是打包、安装、测试与静态检查的唯一配置来源。

[build-system]
# 构建后端使用 setuptools + wheel。
# 下限取 77.0，因为本文件使用 PEP 639 的 SPDX 许可证表达式写法，
# 该写法需要 setuptools>=77 才能识别；低于此版本会把 license 当非法值拒绝。
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name（PyPI 展示名）可用驼峰，用于品牌展示；
# import 时仍用小写 aquamind（PEP 8），pip 安装大小写不敏感（PEP 503）
name = "AquaMind"
# 版本号与 src/aquamind/__init__.py 的 __version__ 手工双写保持一致
version = "0.0.4"
description = "LLM 应用并发质量判定工具（建设中）：M1 底座已交付（SSE 帧解析 / 时序回放 / 预算熔断 / 多模型适配）；M3-M4 将交付统计推断 + 测量自证 + 预注册冻结门禁。回答「这个下降是不是真的」。"
readme = "README.md"
requires-python = ">=3.11"
# 许可证采用 PEP 639 的 SPDX 表达式写法，不使用已弃用的 License 分类器
license = "MIT"
authors = [{ name = "hu-chenyu" }]
# 检索词只保留已交付或已定位的：M1 已交付 sse / replay / budget；
# rag 会把不做的 RAG 测试引来，ttft 属 M3 指标，agent 用例属 M2，
# 三者交付后再随对应里程碑加回，避免检索结果与实际能力错位。
keywords = ["llm", "testing", "evaluation", "llm-testing", "performance-testing", "load-testing", "quality-gate", "sse", "replay", "statistical-testing", "pytest", "ci-cd", "agent-testing", "llm-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    # 只声明 CI 实际跑过的版本。当前矩阵为 3.11（ubuntu + windows 双平台）；
    # 3.12/3.13 未经任何流水线验证，故不声明。D18 加入探测位验证通过后再加回。
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心运行时依赖：只放"任何一次评测都绕不开"的三件东西。
# pydantic 负责数据契约与边界校验，typer 负责命令行，httpx 负责异步 HTTP 调用。
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# dev：本地开发与 CI 全量使用，覆盖率门槛与静态检查都依赖这一组
#
# 上界不是保守，而是可复现：工具的默认行为会随发布漂移，无上界时 CI 每次装到的
# 都是当时最新版，判定口径随之改变，而本地未必复现得出来。Run #55 即为实例——
# ruff 0.17 扩大默认规则集（新增 EXE001 等），scripts/ 首次纳入 lint 即撞上，
# 且该规则只在类 Unix 生效、Windows 侧不判定，本地装什么版本都绿。
#
# 三处上界的下界都取**当前已实测通过的小版本**（pytest 9.1.1 / mypy 2.3.1 /
# ruff 0.16.9，均为本地 548 passed + mypy 零错误时的实际版本），而不是回退到
# 旧大版本——锁在未验证的旧版同样是不可复现的另一种形式。
# D18 CI 矩阵升级时重新评估。
dev = [
    # pytest 10 可能改动 fixture / 插件 API
    "pytest>=9.1,<10.0",
    # pytest-cov 8 可能改动 coverage 报告与 --cov 相关行为
    "pytest-cov>=7.1,<8.0",
    # pytest-asyncio 2 可能改动事件循环与 fixture 语义
    "pytest-asyncio>=1.4,<2.0",
    # mypy 3 可能带类型系统语义变更
    "mypy>=2.3,<3.0",
    "ruff>=0.5,<0.18",
    "build>=1.2",
    "twine>=5.1",
]
# docs：文档站点构建，M2 起随 mkdocstrings 自动生成 API 参考
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# openai：官方 SDK，仅在需要调用 OpenAI 兼容端点时安装，保持基础安装轻量
openai = [
    "openai>=1.30",
]

[project.urls]
Homepage = "https://github.com/hu-chenyu/AquaMind"
Repository = "https://github.com/hu-chenyu/AquaMind"

[project.scripts]
# 命令行入口：app 对象由 M1 后续任务在 aquamind/cli.py 中实现
aquamind = "aquamind.cli:app"

[tool.setuptools.packages.find]
# src 布局：包源码位于 src/ 下，避免本地目录遮蔽已安装包带来的导入歧义
where = ["src"]

[tool.setuptools.package-data]
# py.typed 是 PEP 561 类型标记，必须随包分发，否则下游拿不到类型信息
aquamind = ["py.typed"]

[tool.pytest.ini_options]
# 测试根目录固定为 tests/
testpaths = ["tests"]
# 只收集 test_ 前缀文件，避免把辅助模块当测试执行
python_files = ["test_*.py"]
# 异步测试默认启用自动模式，省去逐条打 asyncio 标记的负担
asyncio_mode = "auto"
# 显式声明 slow 标记，避免未知标记告警
markers = ["slow: 耗时较长的安装与构建校验"]
# CI 零警告护栏：PytestCollectionWarning 直接判红（专治 __test__=False 被删后 TestCase 被误收集）
filterwarnings = ["error::pytest.PytestCollectionWarning"]

[tool.coverage.run]
# 覆盖率只统计包源码，示例与测试自身不计入
source = ["src/aquamind"]
# 开启分支覆盖，避免"行覆盖达标但分支没测到"
branch = true

[tool.ruff]
# 单行长度上限设为 100，兼顾可读性
line-length = 100
# 以支持矩阵的下限版本为目标生成检查规则
target-version = "py311"
# 源码与测试一并检查
src = ["src", "tests"]

[tool.ruff.lint]
# 显式启用 E501：line-length=100 在 ruff 默认规则集里**不生效**（默认只查
# E4/E7/E9/F），于是"行长 100"此前只是一句无人执行的声明，101+ 字符行不被拦截
#
# 用 extend-select 而非 select：select 会**顶掉**默认规则集，E501 到位的同时
# F401（未使用导入）等既有检查会一起失效——那是把"加严"做成了"放宽"。已实测确认：
# `--select E501` 只报 E501，`--extend-select E501` 两者都报
extend-select = ["E501"]

[tool.mypy]
# 全量严格模式，缺失类型标注即视为错误
strict = true
# 类型检查以支持矩阵的下限版本为准
python_version = "3.11"
