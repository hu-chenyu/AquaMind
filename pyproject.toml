# AquaMind 项目元数据与工具链配置。
# 本文件由 M0 占位版补全而来（AM-Day1 / M1-D01），是打包、安装、测试与静态检查的唯一配置来源。

[build-system]
# 构建后端使用 setuptools + wheel。
# 下限取 77.0，因为本文件使用 PEP 639 的 SPDX 许可证表达式写法，
# 该写法需要 setuptools>=77 才能识别；低于此版本会把 license 当非法值拒绝。
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name（PyPI 展示名）可用驼峰，用于品牌展示；
# import 时仍用小写 aquamind（PEP 8），pip 安装大小写不敏感（PEP 503）
name = "AquaMind"
# 版本号与 src/aquamind/__init__.py 的 __version__ 手工双写保持一致
version = "0.0.4"
description = "LLM 应用功能与非功能一体化测试工具：并发负载下联动测量 TTFT/质量退化/成本，输出 SLO 双门禁报告"
readme = "README.md"
requires-python = ">=3.11"
# 许可证采用 PEP 639 的 SPDX 表达式写法，不使用已弃用的 License 分类器
license = "MIT"
authors = [{ name = "hu-chenyu" }]
keywords = ["llm", "testing", "evaluation", "llm-testing", "performance-testing", "load-testing", "quality-gate", "slo", "ttft", "pytest", "rag", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心运行时依赖：只放"任何一次评测都绕不开"的三件东西。
# pydantic 负责数据契约与边界校验，typer 负责命令行，httpx 负责异步 HTTP 调用。
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# dev：本地开发与 CI 全量使用，覆盖率门槛与静态检查都依赖这一组
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.1",
]
# docs：文档站点构建，M2 起随 mkdocstrings 自动生成 API 参考
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# openai：官方 SDK，仅在需要调用 OpenAI 兼容端点时安装，保持基础安装轻量
openai = [
    "openai>=1.30",
]

[project.urls]
Homepage = "https://github.com/hu-chenyu/AquaMind"
Repository = "https://github.com/hu-chenyu/AquaMind"

[project.scripts]
# 命令行入口：app 对象由 M1 后续任务在 aquamind/cli.py 中实现
aquamind = "aquamind.cli:app"

[tool.setuptools.packages.find]
# src 布局：包源码位于 src/ 下，避免本地目录遮蔽已安装包带来的导入歧义
where = ["src"]

[tool.setuptools.package-data]
# py.typed 是 PEP 561 类型标记，必须随包分发，否则下游拿不到类型信息
aquamind = ["py.typed"]

[tool.pytest.ini_options]
# 测试根目录固定为 tests/
testpaths = ["tests"]
# 只收集 test_ 前缀文件，避免把辅助模块当测试执行
python_files = ["test_*.py"]
# 异步测试默认启用自动模式，省去逐条打 asyncio 标记的负担
asyncio_mode = "auto"
# 显式声明 slow 标记，避免未知标记告警
markers = ["slow: 耗时较长的安装与构建校验"]

[tool.coverage.run]
# 覆盖率只统计包源码，示例与测试自身不计入
source = ["src/aquamind"]
# 开启分支覆盖，避免"行覆盖达标但分支没测到"
branch = true

[tool.ruff]
# 单行长度上限设为 100，兼顾可读性
line-length = 100
# 以支持矩阵的下限版本为目标生成检查规则
target-version = "py311"
# 源码与测试一并检查
src = ["src", "tests"]

[tool.mypy]
# 全量严格模式，缺失类型标注即视为错误
strict = true
# 类型检查以支持矩阵的下限版本为准
python_version = "3.11"
