name: CI

# D2 起即生效的质量护栏（对应开发计划 CI 门禁条款的提前落地）。
# M1 首个测试用例入库前，pytest 以"未收集到测试不判红"的方式运行；用例落地后自动转硬门禁。

on:
  push:
    branches: [main]
  pull_request:

env:
  # 测试收集数下限（比照 TestMatrix 的 TEST_COUNT_BASELINE 做法，改动为 -lt 下限）。
  # 当前 M1 实收 548 条；下调此值等于承认「删掉一部分用例」，须在提交信息里说明。
  TEST_COUNT_FLOOR: "548"

jobs:
  quality:
    name: lint-test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    # Windows runner 默认 shell 为 pwsh，这里统一指定 bash（Git Bash 随 runner 内置），
    # 保证 pytest 退出码容忍逻辑与脚本行为在两个平台上完全一致。
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Security audit (pip-audit)
        # 核心期即开启依赖漏洞扫描（原计划仅维护期 T9-04 覆盖）。
        # 若出现当前无法立即升级的告警，须用 `pip-audit --ignore <VULN-ID>` 定向放行，
        # 并在此处注释登记原因与复审过期日；禁止无注释的全局忽略。
        run: pip-audit

      - name: Ruff lint
        # scripts/ 纳入检查：pre_release_scan.py 是 tracked 公开脚本，
        # 风格退化不应只在本地才可见。
        run: ruff check src tests scripts

      - name: Mypy strict
        run: mypy src

      - name: Test collection floor
        # 收集数下限门禁：防止「测试被误删」或「全部用例收集失败」时 CI 仍判绿。
        # 用 -lt 下限而非相等，新增用例不必改此处；确需下调时须确认是刻意删用例。
        run: |
          count=$(pytest --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | grep -oE '[0-9]+' | head -1)
          if [ -z "$count" ]; then
            echo "收集数门禁：未能解析到收集数（pytest --collect-only 输出异常）" >&2
            pytest --collect-only -q 2>&1 | tail -20 >&2
            exit 1
          fi
          if [ "$count" -lt "$TEST_COUNT_FLOOR" ]; then
            echo "收集数 $count 低于下限 $TEST_COUNT_FLOOR" >&2
            exit 1
          fi
          echo "收集数 $count >= 下限 $TEST_COUNT_FLOOR，通过"

      - name: Pytest
        # 硬门禁，不再容忍退出码 5。M1 首批用例已入库（当前 548 条），
        # 「未收集到测试」只应表示真实故障，不该与通过等价。
        run: pytest -q
